<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorkurs — Repositioning Review</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    line-height: 1.7;
    padding: 40px 20px;
  }
  .container { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 36px; padding-bottom: 16px; border-bottom: 2px solid #1a1a1a; }
  header h1 { font-size: 24px; font-weight: 700; }
  header p { color: #666; font-size: 13px; margin-top: 4px; }

  .section { margin-bottom: 36px; }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    margin-bottom: 16px;
  }

  .item {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .item.status-agree { border-left: 4px solid #2ecc71; }
  .item.status-disagree { border-left: 4px solid #e74c3c; }
  .item.status-partially { border-left: 4px solid #f39c12; }

  .item-content { padding: 16px 20px; }
  .item-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .item-body { font-size: 14px; color: #4a4a4a; }

  .item-actions {
    display: flex;
    gap: 6px;
    padding: 0 20px 12px;
  }
  .btn {
    padding: 4px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .btn:hover { background: #f0f0f0; }
  .btn.active-agree { background: #2ecc71; color: #fff; border-color: #2ecc71; }
  .btn.active-disagree { background: #e74c3c; color: #fff; border-color: #e74c3c; }
  .btn.active-partially { background: #f39c12; color: #fff; border-color: #f39c12; }

  .note-area {
    padding: 0 20px 16px;
  }
  .note-area textarea {
    width: 100%;
    min-height: 50px;
    padding: 8px 10px;
    border: 1px solid #eee;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    resize: vertical;
    color: #1a1a1a;
    background: #fafafa;
  }
  .note-area textarea:focus { outline: none; border-color: #999; background: #fff; }
  .note-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

  .general-notes {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .general-notes h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .general-notes textarea {
    width: 100%;
    min-height: 80px;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    color: #1a1a1a;
    background: #fafafa;
  }
  .general-notes textarea:focus { outline: none; border-color: #999; background: #fff; }

  .actions-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .save-btn {
    padding: 10px 20px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .save-btn:hover { background: #333; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Vorkurs — Repositioning Review</h1>
    <p>React to each suggestion: Agree, Disagree, or Partially. Add notes to explain your thinking. Export when done.</p>
  </header>

  <div id="content"></div>

  <div class="general-notes">
    <h3>Overall direction / things I haven't covered</h3>
    <textarea id="generalNotes" placeholder="Anything else on your mind about the repositioning..." oninput="save()"></textarea>
  </div>

  <div class="actions-bar">
    <button class="save-btn" onclick="exportNotes()">Export Notes</button>
  </div>
</div>

<script>
const data = [
  {
    section: "What to keep",
    items: [
      {
        id: "keep_de",
        title: "Keep the design engineering identity",
        body: "It's differentiating and true to who you are. Very few people can credibly claim this position. Don't drop it — reframe it as part of a broader offering."
      },
      {
        id: "keep_principles",
        title: "Keep the Principles section",
        body: "Form follows function, one person no handoff, systems over pages, built to last. These are strong. They could be refined (we already updated two for the LinkedIn post) but the section works."
      },
      {
        id: "keep_cases",
        title: "Keep the case studies",
        body: "citizenM, CrossBoundary, Activant Capital, Erik Kessels — these are impressive and varied. They show range: hospitality, finance, sustainable development, art. That range is an asset."
      },
      {
        id: "keep_engagements",
        title: "Keep the engagement models (How we work together)",
        body: "Audit, Embedded, Project, Advisory — these are already well-structured and cover the full spectrum from one-off to ongoing. The descriptions might need updating but the structure is right."
      }
    ]
  },
  {
    section: "What to shift",
    items: [
      {
        id: "shift_hero",
        title: "Rewrite the hero — broader, less technical",
        body: "Current: 'A design engineering studio that closes the gap between how things are designed and how they're built.' This speaks to product teams hiring a design systems specialist. It doesn't speak to a CEO, a hotel group, or an investment fund. Proposed direction: lead with the value (clarity, structure, durability) not the method (design systems, Figma, code)."
      },
      {
        id: "shift_services",
        title: "Reframe 'What we do' from execution to thinking + execution",
        body: "Current services are: Design Systems, Creative Direction & UI Design, Strategy & Audits, Stewardship. These are all framed as hands-on execution. The 'Our practice' descriptions you wrote earlier were much stronger: Consulting & Strategy, System Design & Integration, Implementation & Engineering, Stewardship & Evolution. They led with the thinking, not the tools."
      },
      {
        id: "shift_language",
        title: "Reduce technical language throughout",
        body: "Current copy mentions: Auto Layout, tokens, variables, Next.js, Nuxt, React, Shopify, Webflow, Framer, Figma files, codebase. This is great if your audience is a Head of Design at a tech company. It alienates hospitality clients, investment funds, architecture studios. The technical credibility should come through the case studies, not the service descriptions."
      },
      {
        id: "shift_tone",
        title: "Warm up the tone slightly",
        body: "Current tone is confident and direct (good) but a bit cold. The 'Our practice' descriptions you shared earlier had more warmth: 'We help you understand what needs to happen, and what doesn't' is much more inviting than 'We build component libraries that work in Figma and in code.' The directness should stay, but it can be more human."
      }
    ]
  },
  {
    section: "What to add",
    items: [
      {
        id: "add_consulting",
        title: "Add consulting/strategy as a first-class offering",
        body: "Right now strategy is buried under 'Strategy & Audits' and framed as a one-week tactical thing. For the repositioning to work, consulting needs to sit alongside building as an equal. Not 'we also do strategy' but 'we think clearly about your situation and then we build the right thing.'"
      },
      {
        id: "add_who",
        title: "Add a short 'Who this is for' signal",
        body: "The current site doesn't tell visitors who Vorkurs is for. A subtle signal — even just through the language and case studies — that this is for organisations who care about quality, durability, and getting it right. Not startups who need to move fast and break things."
      },
      {
        id: "add_intro",
        title: "Add a brief intro about Marco / the studio",
        body: "There's no 'about' section. Visitors don't know if Vorkurs is one person, ten people, or an agency. A short paragraph about you — your background, your approach, maybe the backendforth collaboration — would build trust."
      },
      {
        id: "add_principles_update",
        title: "Update principles to include 'Form follows function' and 'True materials'",
        body: "We refined two principles for the LinkedIn post that are stronger than the current versions: 'Form follows function' (replacing 'Function first') and 'True materials' (new — about working with what's real and sustainable for the client). These should replace or complement the current four."
      }
    ]
  }
];

let state = {};

function load() {
  try {
    const s = localStorage.getItem('vorkurs-repositioning');
    if (s) state = JSON.parse(s);
  } catch(e) { state = {}; }
}

function save() {
  state.generalNotes = document.getElementById('generalNotes').value;
  localStorage.setItem('vorkurs-repositioning', JSON.stringify(state));
}

function getState(id) {
  return state[id] || { status: null, note: '' };
}

function setStatus(id, status) {
  if (!state[id]) state[id] = { status: null, note: '' };
  state[id].status = state[id].status === status ? null : status;
  save();
  render();
}

function setNote(id, note) {
  if (!state[id]) state[id] = { status: null, note: '' };
  state[id].note = note;
  save();
}

function render() {
  const container = document.getElementById('content');
  container.innerHTML = '';

  data.forEach(section => {
    const sDiv = document.createElement('div');
    sDiv.className = 'section';
    sDiv.innerHTML = `<div class="section-label">${section.section}</div>`;

    section.items.forEach(item => {
      const s = getState(item.id);
      const statusClass = s.status ? `status-${s.status}` : '';
      const iDiv = document.createElement('div');
      iDiv.className = `item ${statusClass}`;
      iDiv.innerHTML = `
        <div class="item-content">
          <div class="item-title">${item.title}</div>
          <div class="item-body">${item.body}</div>
        </div>
        <div class="item-actions">
          <button class="btn ${s.status === 'agree' ? 'active-agree' : ''}" onclick="setStatus('${item.id}', 'agree')">Agree</button>
          <button class="btn ${s.status === 'partially' ? 'active-partially' : ''}" onclick="setStatus('${item.id}', 'partially')">Partially</button>
          <button class="btn ${s.status === 'disagree' ? 'active-disagree' : ''}" onclick="setStatus('${item.id}', 'disagree')">Disagree</button>
        </div>
        <div class="note-area">
          <div class="note-label">Your notes</div>
          <textarea placeholder="What's your thinking?" oninput="setNote('${item.id}', this.value)">${s.note || ''}</textarea>
        </div>
      `;
      sDiv.appendChild(iDiv);
    });

    container.appendChild(sDiv);
  });

  document.getElementById('generalNotes').value = state.generalNotes || '';
}

function exportNotes() {
  const notes = { items: {}, generalNotes: state.generalNotes || '' };
  data.forEach(section => {
    section.items.forEach(item => {
      const s = getState(item.id);
      notes.items[item.id] = {
        title: item.title,
        section: section.section,
        status: s.status || 'not reviewed',
        note: s.note || ''
      };
    });
  });

  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'vorkurs-repositioning-notes.json';
  a.click();
  URL.revokeObjectURL(url);
}

load();
render();
</script>
</body>
</html>
